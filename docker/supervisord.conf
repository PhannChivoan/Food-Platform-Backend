[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; runs the scheduled jobs (cancel unpaid online orders, reassign slow riders). Keep ONE replica of this service.
[program:scheduler]
command=runuser -u www-data -- php /var/www/html/artisan schedule:work
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; sends the queued order emails. Only active when QUEUE_CONNECTION=database; with "sync" mails go out inside the request.
[program:queue]
command=sh -c 'if [ "$QUEUE_CONNECTION" = "database" ]; then exec runuser -u www-data -- php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600; else exec sleep infinity; fi'
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
